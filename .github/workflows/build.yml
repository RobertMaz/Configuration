name: Build

on:
  push:
    branches: [main]
    paths:
      - 'proxy.list'
      - 'build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  XRAY_VERSION: v26.2.6   # как на роутерах

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: python3 build.py

      - name: Validate with xray
        run: |
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          mkdir -p /tmp/conf
          echo '{"outbounds":[{"tag":"direct","protocol":"freedom"},{"tag":"proxy","protocol":"freedom"}]}' > /tmp/conf/00-base.json
          cp generated/xray-routing.json /tmp/conf/10-routing.json
          /tmp/xray/xray run -test -confdir /tmp/conf

      - name: Commit
        run: |
          git add generated/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: rebuild generated/"
          git pull --rebase
          git push
