name: Build

on:
  push:
    branches: [main]
    paths:
      - 'proxy.list'
      - 'build.py'
      - 'router/00-base.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: python3 build.py

      # Обе версии, что крутятся на роутерах: latest (home-msk качает его при старте)
      # и пакет opkg из OpenWrt 24.10. Проверяется полный конфиг: шаблон роутера + правила.
      - name: Validate with xray
        run: |
          mkdir -p /tmp/conf
          sed -e 's/__UUID__/00000000-0000-0000-0000-000000000000/' -e 's|__WS_PATH__|/ci|' router/00-base.json > /tmp/conf/00-base.json
          cp generated/xray-routing.json /tmp/conf/10-routing.json
          for url in \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.1.30/Xray-linux-64.zip
          do
            rm -rf /tmp/xray && curl -fsSL -o /tmp/xray.zip "$url" && unzip -q /tmp/xray.zip xray -d /tmp/xray
            /tmp/xray/xray version
            /tmp/xray/xray run -test -confdir /tmp/conf
          done

      - name: Commit
        run: |
          git add generated/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: rebuild generated/"
          git pull --rebase
          git push
