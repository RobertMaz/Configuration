[custom]
;Proxy group
custom_proxy_group=Proxy`url-test`.*`http://cp.cloudflare.com`300,,150

;Proxy domains — only these go through VPN
;Auto-updated from blackmatrix7/ios_rule_script via .github/workflows/update-rules.yml (daily 04:00 UTC)
surge_ruleset=Proxy,https://raw.githubusercontent.com/RobertMaz/Configuration/main/proxy.yaml

;Everything else direct (whitelist Proxy — same logic as routers)
surge_ruleset=DIRECT,[]MATCH

enable_rule_generator=true
overwrite_original_rules=true
