[custom]
; Политика Clash-клиентов (подключается через &config= в ссылке subconverter).
; Через VPN — только generated/proxy.list, всё остальное напрямую. Та же логика, что на роутерах.
; Список не править здесь — он собирается из rules/ (см. README).

custom_proxy_group=Proxy`url-test`.*`http://cp.cloudflare.com`300,,150

surge_ruleset=Proxy,https://raw.githubusercontent.com/RobertMaz/Configuration/main/generated/proxy.list
surge_ruleset=DIRECT,[]MATCH

enable_rule_generator=true
overwrite_original_rules=true
